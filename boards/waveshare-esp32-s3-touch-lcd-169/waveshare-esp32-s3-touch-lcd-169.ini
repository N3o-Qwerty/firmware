; Waveshare ESP32-S3-Touch-LCD-1.69
; ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, 240x280 ST7789, CST816T touch.
; Pin map verified against Waveshare docs (current pinout only) and the
; working Arduino_GFX bring-up (DC4 CS5 SCK6 MOSI7 RST8 BL15, touch SDA11 SCL10
; RST13 INT14). There is no AXP2101 on this board; charging is an ETA6098 with
; no status GPIO. Older boards that put power on GPIO35/GPIO36 are not
; supported: those pins are octal PSRAM. See connections.md.

[env:waveshare-esp32-s3-touch-lcd-169]
board = waveshare-esp32-s3-touch-lcd-169
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/waveshare-esp32-s3-touch-lcd-169>
; Font sizes are project-only. FastLED has an FP:: fixed-point namespace, so a
; global -DFP breaks that library. precompiler_flags.h supplies the same defaults
; when these are absent; these flags keep the board explicit for src/.
build_src_flags =
	${env.build_src_flags}
	-DFP=1
	-DFM=2
	-DFG=3
build_flags =
	${env.build_flags}
	-Iboards/waveshare-esp32-s3-touch-lcd-169
	-Os
	-DCORE_DEBUG_LEVEL=1

	-DREMOVE_RFID_HW_INTERFACE

	; No onboard Si4713, microphone, or I2S speaker.
	-DFM_RSTPIN=-1

	; Onboard passive buzzer (new revision). Legacy GPIO33 conflicts with OPI PSRAM.
	-DBUZZ_PIN=42

	; Extension UART (also the default UART0 pins).
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; PCF85063A at 0x51 on the shared I2C bus. No AXP2101.
	-DHAS_RTC=1
	-DHAS_RTC_PCF85063A=1
	-DRTC_SDA=11
	-DRTC_SCL=10

	; Native USB HID (ESP32-S3 OTG). BAD_TX/RX are unused while USB_as_HID is set.
	-DUSB_as_HID=1
	-DBAD_TX=43
	-DBAD_RX=44

	; Battery divider on GPIO1: 200k / 100k, VBAT = Vadc * 3. Not a fuel gauge.
	; Charge state is not wired to a GPIO (ETA6098).
	-DWS_BAT_ADC=1

	; Current Waveshare pinout only. SYS_EN high keeps the battery path on.
	; PWR reads SYS_OUT (active low). Do not move these to GPIO35/GPIO36:
	; that older PCB uses octal-PSRAM lines, and this env keeps PSRAM enabled.
	-DWS_SYS_EN=41
	-DWS_PWR_BTN=40

	; BOOT is the only other button. PWR is handled in interface.cpp.
	-DHAS_BTN=1
	-DBTN_ALIAS='"Boot"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	; No onboard IR LED or one-pin RF module. Do not offer every GPIO.
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DTXLED=-1
	-DRXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	; No CC1101 / NRF24 / W5500 on the stock board. Extension header is only
	; GPIO2, GPIO3, GPIO17, GPIO18 plus the shared I2C and UART.
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=-1
	-DCC1101_MOSI_PIN=-1
	-DCC1101_SCK_PIN=-1
	-DCC1101_MISO_PIN=-1
	-DNRF24_CE_PIN=-1
	-DNRF24_SS_PIN=-1
	-DNRF24_MOSI_PIN=-1
	-DNRF24_SCK_PIN=-1
	-DNRF24_MISO_PIN=-1
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=-1
	-DW5500_SCK_PIN=-1
	-DW5500_MISO_PIN=-1
	-DW5500_INT_PIN=-1

	; Portrait matches the stock Arduino_GFX rotation 0 (240x280).
	-DHAS_SCREEN=1
	-DROTATION=0
	-DBACKLIGHT=15
	-DMINBRIGHT=1

	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	; TFT_eSPI. 240x280 selects the ST7789 CGRAM offset (row start 20), which
	; matches Arduino_GFX (..., 0, 20, 0, 20) and the stock rotation-0 window.
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_BL=15
	-DTFT_MISO=-1
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=5
	-DTFT_DC=4
	-DTFT_RST=8
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	-DHAS_TOUCH=1
	-DWS_TP_SDA=11
	-DWS_TP_SCL=10
	-DWS_TP_RST=13
	-DWS_TP_INT=14

	; No SD socket.
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; Extension I2C is the same pair the touch controller and RTC use.
	-DGROVE_SDA=11
	-DGROVE_SCL=10
	-DSYS_I2C_SDA=11
	-DSYS_I2C_SCL=10

	-DSPI_SCK_PIN=-1
	-DSPI_MOSI_PIN=-1
	-DSPI_MISO_PIN=-1
	-DSPI_SS_PIN=-1

	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

	-DDEVICE_NAME='"WS S3 Touch 1.69"'

lib_deps =
	${env.lib_deps}
